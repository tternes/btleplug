plugins {
    id 'com.android.library'
    id 'maven-publish'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.nonpolynomial.btleplug.android'
    compileSdk 34

    defaultConfig {
        minSdk 24
        versionCode 1
        versionName '0.7.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release')
    }
}

dependencies {
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // Overridable so a fork or a JitPack build can publish under its own
                // coordinates without patching this file.
                groupId = project.findProperty('publishGroupId') ?: 'com.nonpolynomial'
                artifactId = project.findProperty('publishArtifactId') ?: 'droidplug'
                version = project.findProperty('publishVersion') ?: '0.12.0'
                from components.release
            }
        }
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'btleplug-jni'
    from compileDebugJavaWithJavac.destinationDirectory
    destinationDirectory = file("$buildDir/libs")
    dependsOn 'compileDebugJavaWithJavac'
}
