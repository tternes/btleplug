# Publish under this fork's JitPack coordinates. JitPack serves
# com.github.<owner>:<repo>, and matching them locally means a ~/.m2 build and a
# JitPack build are interchangeable for consumers. The version comes from the
# command line (jitpack.yml passes the ref being built).
publishGroupId=com.github.tternes
publishArtifactId=btleplug
